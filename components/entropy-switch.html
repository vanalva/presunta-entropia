<!-- ============================================================
  ENTROPY SWITCH — reusable component
  Mockup: asterisk (= entropía, left) | pill toggle | grid (= organizado, right)
  Placement: hero card header row (.navbar18_container), right-aligned,
  BEFORE .navbar18_wrapper (cart). Same row as the logo.

  Wiring: src/js/entropy-mode.js binds every [data-entropy-switch] button,
  toggles window.__peEntropy, and reflects state (knob .is-on + icon
  .is-active). No inline JS here. The pill shape is sanctioned by Juan's
  entropy-switch mockup (exception to the 12px-squared button law).

  State meaning: entropy ON → knob sits LEFT (asterisk side), asterisk lit.
  Default organized → knob RIGHT (grid side), grid lit.

  CSS lives in project.css (entropy-switch_* classes). PRM handling lives
  in entropy-mode.js injected CSS.
  ============================================================ -->
