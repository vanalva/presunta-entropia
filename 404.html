      (function() {
        function getBackgroundColor(el) {
          var bg = window.getComputedStyle(el).backgroundColor;
          if (bg === 'transparent' || bg === 'rgba(0, 0, 0, 0)') {
            if (el.parentElement) {
              return getBackgroundColor(el.parentElement);
            }
            return 'transparent';
          }
          return bg;
        }
        function applyScrollbarStyles(el) {
          var thumbColor = el.getAttribute('data-scrollbar-color');
          var trackColor = el.getAttribute('data-scrollbar-track');
          // Apply thumb color
          if (thumbColor) {
            el.style.setProperty('--scrollbar-thumb', thumbColor);
          }
          // Apply track color (auto = inherit from element bg)
          if (trackColor === 'auto') {
            var bg = getBackgroundColor(el);
            el.style.cssText += 'scrollbar-color: ' + (thumbColor || '#0d161d') + ' ' + bg + ' !important;';
            // For webkit, inject a style rule
            injectScrollbarStyle(el, thumbColor || '#0d161d', bg);
          } else if (trackColor) {
            el.style.cssText += 'scrollbar-color: ' + (thumbColor || '#0d161d') + ' ' + trackColor + ' !important;';
            injectScrollbarStyle(el, thumbColor || '#0d161d', trackColor);
          }
          // Sync html/body
          if (el === document.documentElement || el === document.body) {
            if (thumbColor) {
              document.documentElement.style.setProperty('--scrollbar-thumb', thumbColor);
              document.body.style.setProperty('--scrollbar-thumb', thumbColor);
            }
          }
        }
        // Inject webkit scrollbar styles for specific elements
        var styleSheet = null;
        var styleRules = {};
        function injectScrollbarStyle(el, thumb, track) {
          if (!styleSheet) {
            var style = document.createElement('style');
            document.head.appendChild(style);
            styleSheet = style.sheet;
          }
          // Create unique class
          var className = 'scrollbar-custom-' + Math.random().toString(36).substr(2, 9);
          el.classList.add(className);
          var rules = [
            '.' + className + '::-webkit-scrollbar { background: ' + track + '; }',
            '.' + className + '::-webkit-scrollbar-track { background: ' + track + '; }',
            '.' + className + '::-webkit-scrollbar-thumb { background: ' + thumb + '; }',
            '.' + className + '::-webkit-scrollbar-corner { background: ' + track + '; }'
          ];
          rules.forEach(function(rule) {
            try {
              styleSheet.insertRule(rule, styleSheet.cssRules.length);
            } catch (e) {}
          });
        }
        function init() {
          document.querySelectorAll('[data-scrollbar-color], [data-scrollbar-track]').forEach(applyScrollbarStyles);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) {
                if (node.hasAttribute && (node.hasAttribute('data-scrollbar-color') || node.hasAttribute('data-scrollbar-track'))) {
                  applyScrollbarStyles(node);
                }
                if (node.querySelectorAll) {
                  node.querySelectorAll('[data-scrollbar-color], [data-scrollbar-track]').forEach(applyScrollbarStyles);
                }
              }
            });
          });
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      })();
